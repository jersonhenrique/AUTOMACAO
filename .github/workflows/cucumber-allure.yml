name: Cucumber and Allure

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cucumber:
    runs-on: ubuntu-latest
    outputs:
      report_generated: ${{ steps.generate-report.outputs.report_generated }}
    env:
      BASE_URL: ${{ vars.BASE_URL || 'http://automationpractice.com' }}
      BROWSER: chrome_headless
    defaults:
      run:
        working-directory: Cucumber/CADASTRO-CLIENTE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: Cucumber/CADASTRO-CLIENTE

      - name: Install Allure CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/allure-framework/allure2/releases/download/2.46.1/allure-2.46.1.zip \
            --output "$RUNNER_TEMP/allure.zip"
          unzip -q "$RUNNER_TEMP/allure.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/allure-2.46.1/bin/allure"
          echo "$RUNNER_TEMP/allure-2.46.1/bin" >> "$GITHUB_PATH"

      - name: Run Cucumber tests
        run: bundle exec cucumber -p allure

      - name: Generate Allure report
        id: generate-report
        if: always()
        shell: bash
        run: |
          echo "report_generated=false" >> "$GITHUB_OUTPUT"
          if [ -d allure-results ] && find allure-results -name '*-result.json' -print -quit | grep -q .; then
            allure generate allure-results --clean -o allure-report
            echo "report_generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Allure test results were generated."
            exit 1
          fi

      - name: Upload Allure report and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            Cucumber/CADASTRO-CLIENTE/allure-report
            Cucumber/CADASTRO-CLIENTE/allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload report for GitHub Pages
        if: always() && steps.generate-report.outputs.report_generated == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Cucumber/CADASTRO-CLIENTE/allure-report

  deploy-pages:
    needs: cucumber
    if: always() && needs.cucumber.outputs.report_generated == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4